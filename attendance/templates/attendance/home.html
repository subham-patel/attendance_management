<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #f0f6ff, #dfeeff);
            color: #1d3557;
        }
        .container {
            max-width: 1000px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            background: #f1f7ff;
            border: 1px solid #cfe0ff;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
        }
        .link {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 24px;
            background: #1d4ed8;
            color: white;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
        }
        .link:hover {
            background: #163ea7;
        }
    </style>
    {% load static %}
    <link rel="stylesheet" href="{% static 'attendance/theme.css' %}">
</head>
<body>
    <div class="container">
        <h1 class="home-title">Student Attendance Management System</h1>
        <p class="tagline">Presence, in motion.</p>

        <div style="text-align:center;">
            <a class="link" href="{% url 'student_login' %}">Student Login</a>
            <a class="link" href="{% url 'teacher_login' %}" style="margin-left: 10px; background: #059669;">Teacher Login</a>
        </div>
    </div>
</body>
</html>
