<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef6ff, #dfeeff);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
            width: 100%;
            max-width: 400px;
        }
        h2 { text-align: center; }
        form { display: flex; flex-direction: column; gap: 12px; }
        input, button {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 15px;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }
        .errorlist {
            color: #b91c1c;
            list-style: none;
            padding-left: 0;
        }
    </style>
    {% load static %}
    <link rel="stylesheet" href="{% static 'attendance/theme.css' %}">
</head>
<body>
    <div class="box">
        <h2>Teacher Admin Login</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>

        <p style="text-align:center; margin-top: 20px;">
            <a href="{% url 'home' %}" style="text-decoration:none; color:#1d4ed8; font-weight:bold;">Back to Home</a>
        </p>
    </div>
</body>
</html>
